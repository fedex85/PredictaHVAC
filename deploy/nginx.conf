# /etc/nginx/sites-available/predicta  (sustituye TU_DOMINIO por tu dominio)
# Certbot completa/ajusta los bloques de certificado: sudo certbot --nginx -d TU_DOMINIO
upstream predicta { server unix:/run/predicta/gunicorn.sock fail_timeout=0; }

# --- Límite de peticiones por IP (frena la fuerza bruta además del bloqueo de Django) ---------------------
# Este archivo se incluye dentro de http{}, por eso las zonas pueden declararse aquí.
# Solo se limitan los POST de acceso: con clave vacía Nginx no cuenta la petición.
map $request_method $predicta_clave_acceso { default ""; POST $binary_remote_addr; }
limit_req_zone $predicta_clave_acceso zone=predicta_acceso:10m rate=10r/m;
limit_req_zone $binary_remote_addr    zone=predicta_api:10m    rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_name TU_DOMINIO;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name TU_DOMINIO;
    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;

    # TLS: solo 1.2 y 1.3 (Certbot puede añadir su propio include; no lo dupliques si ya trae estas líneas)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:predicta_tls:10m;
    ssl_session_tickets off;

    server_tokens off;          # no anunciar la versión de Nginx
    # Cabeceras de seguridad que Django no envía (la CSP y la Permissions-Policy las pone Django con nonce)
    add_header X-Content-Type-Options "nosniff" always;

    # Fotos desde el móvil: 25 MB solo en la subida de evidencias; en el resto de rutas, 1 MB
    client_max_body_size 1M;
    client_body_timeout 30s;

    location /static/ {
        alias /srv/predicta/app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # El Service Worker nunca debe quedar en caché larga o las actualizaciones no llegan al móvil.
    location = /sw.js {
        proxy_pass http://predicta;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache";
    }

    # /media/ NO se publica: las fotos y firmas se descargan por vistas de Django que exigen sesión.

    # Inicio de sesión (POST en la raíz), segundo factor, cambio y restablecimiento de contraseña
    location = / {
        limit_req zone=predicta_acceso burst=5 nodelay;
        include snippets/predicta-proxy.conf;
    }
    location /cuenta/ {
        limit_req zone=predicta_acceso burst=5 nodelay;
        include snippets/predicta-proxy.conf;
    }

    # Subida de fotos de las órdenes (la única ruta que necesita cuerpos grandes)
    location ~ ^/ordenes/[0-9]+/(fotos/subir|sincronizar)/$ {
        client_max_body_size 25M;
        include snippets/predicta-proxy.conf;
    }

    # Panel de administración de Django: ruta secreta (DJANGO_ADMIN_URL) y solo desde IPs de confianza / VPN.
    # Sustituye RUTA_ADMIN por el mismo valor que DJANGO_ADMIN_URL y TU_IP_O_VPN por tu IP fija o rango.
    location /RUTA_ADMIN/ {
        allow TU_IP_O_VPN;
        deny all;
        limit_req zone=predicta_acceso burst=5 nodelay;
        include snippets/predicta-proxy.conf;
    }

    # Asistente IA y resto de /api/
    location /api/ {
        limit_req zone=predicta_api burst=20 nodelay;
        include snippets/predicta-proxy.conf;
    }

    location / {
        include snippets/predicta-proxy.conf;
    }
}
