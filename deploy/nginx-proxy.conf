# /etc/nginx/snippets/predicta-proxy.conf  (incluido desde nginx.conf)
# X-Real-IP lo fija Nginx con la IP de la conexión: pisa cualquier valor que envíe el cliente.
# Django (core/auditoria.py) solo lee X-Real-IP; nunca confía en X-Forwarded-For.
proxy_pass http://predicta;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
