{% if orden.estado == 'PENDIENTE' %}<span class="px-2.5 py-1 text-xs rounded-full bg-slate-500/10 text-slate-300 border border-slate-500/30 font-medium whitespace-nowrap">Pendiente</span>
{% elif orden.estado == 'ASIGNADA' %}<span class="px-2.5 py-1 text-xs rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-medium whitespace-nowrap">Asignada</span>
{% elif orden.estado == 'EN_EJECUCION' %}<span class="px-2.5 py-1 text-xs rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium whitespace-nowrap">En ejecución</span>
{% elif orden.estado == 'PENDIENTE_APROBACION' %}<span class="px-2.5 py-1 text-xs rounded-full bg-violet-500/10 text-violet-300 border border-violet-500/20 font-medium whitespace-nowrap">Pendiente de aprobación</span>
{% elif orden.estado == 'FINALIZADA' %}<span class="px-2.5 py-1 text-xs rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium whitespace-nowrap">Finalizada</span>
{% else %}<span class="px-2.5 py-1 text-xs rounded-full bg-red-500/10 text-red-400 border border-red-500/20 font-medium whitespace-nowrap">Cancelada</span>{% endif %}
