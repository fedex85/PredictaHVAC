<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta QR - {{ equipo.nombre }}</title>
    <style>
        @page { size: 60mm 60mm; margin: 0; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #e2e8f0; color: #000; }
        .barra { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 16px; }
        .barra a, .barra button { font: 600 14px Arial, Helvetica, sans-serif; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer; text-decoration: none; }
        .barra button { background: #0891b2; color: #fff; }
        .barra a { background: #fff; color: #0f172a; }
        .aviso { text-align: center; font-size: 13px; color: #475569; margin: 0 16px 16px; }
        .etiqueta { width: 60mm; height: 60mm; margin: 0 auto 24px; background: #fff; padding: 3mm; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; }
        .qr { width: 44mm; height: 44mm; flex: none; }
        .qr svg { display: block; width: 100%; height: 100%; }
        .nombre { width: 100%; text-align: center; font-weight: 700; font-size: 11pt; line-height: 1.15; word-break: break-word; max-height: 2.4em; overflow: hidden; }
        .codigo { width: 100%; text-align: center; font-size: 8pt; margin-top: 0.5mm; color: #000; }
        @media print {
            body { background: #fff; }
            .barra, .aviso { display: none; }
            .etiqueta { margin: 0; }
        }
    </style>
</head>
<body>
    <div class="barra">
        <button type="button" onclick="window.print()">Imprimir etiqueta</button>
        <a href="{% url 'detalle_equipo' equipo.id %}">Volver a la ficha</a>
    </div>
    <p class="aviso">Tamaño de impresión: 6 × 6 cm. En el diálogo de impresión elige escala 100 % y sin márgenes.</p>
    <div class="etiqueta">
        <div class="qr">{{ qr_svg }}</div>
        <div>
            <div class="nombre">{{ equipo.nombre }}</div>
            <div class="codigo">{{ equipo.codigo_identificador }}</div>
        </div>
    </div>
</body>
</html>
