    <p class="text-sm text-slate-400">Tu rol ({{ rol_etiqueta|default:"sin rol" }}) no incluye esta acción. Si la necesitas, pide acceso a un administrador.</p>
    <a href="{% url 'dashboard' %}" class="inline-block px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg transition">Volver al dashboard</a>
</div>
{% endblock %}
