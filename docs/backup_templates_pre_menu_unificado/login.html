<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PredictaHVAC</title>
    <!-- Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal (Tarjetón responsivo) -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden p-6 sm:p-8 space-y-6">
        
        <!-- Encabezado / Logo -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-cyan-100 text-cyan-600 mb-2">
                <!-- Icono de Unidad de Aire Acondicionado / Flujo de aire -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h10a4 4 0 004-4M3 15V9a2 2 0 012-2h14a2 2 0 012 2v6M3 15h18M8 11h8M9 19v2m6-2v2" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">PredictaHVAC</h1>
            <p class="text-sm text-slate-500">Gestor de Mantenimiento de Aire Acondicionado</p>
        </div>

        <!-- Formulario -->
        <form method="POST" action="" class="space-y-4">
            {% csrf_token %}
            
            <!-- Campo Usuario -->
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Usuario / Correo</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    placeholder="usuario@ejemplo.com"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 text-slate-800"
                >
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 text-slate-800"
                >
            </div>

            <!-- Recordar y Recuperar -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-slate-600 cursor-pointer">
                    <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 h-4 w-4">
                    <span class="ml-2">Recordarme</span>
                </label>
                <a href="#" class="text-blue-600 hover:underline font-medium">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón de Ingreso -->
            <button 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg shadow-md hover:shadow-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
                Iniciar Sesión
            </button>
        </form>

        <!-- Pie del card -->
        <div class="text-center text-xs text-slate-400">
            &copy; Gestor de Mantenimiento - Todos los derechos reservados.
        </div>
    </div>

</body>
</html>
